[versions]
kotlin = "2.4.10"
shadow = "9.6.1"
poseidon = "2.0.0-SNAPSHOT"
exposed = "1.4.0"
h2 = "2.4.240"
jperms = "1.0.1"
essentials-libs = "0.0.1"

[libraries]
poseidon = { module = "com.legacyminecraft:poseidon-server", version.ref = "poseidon" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
jperms = { module = "com.johnymuffin.jperms:beta", version.ref = "jperms" }
essentials-libs = { module = "com.earth2me.essentials:essentials-libraries-rollup", version.ref = "essentials-libs" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }