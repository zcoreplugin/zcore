[versions]
kotlin = "2.3.10"
shadow = "9.3.1"
tsunami = "01ae0c3"
exposed = "0.61.0"
h2 = "2.2.224"
brigadier = "1.3.10"
jperms = "1.0.1"
essentials-libs = "0.0.1"
slf4j = "2.0.17"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
tsunami = { module = "com.github.BetaMC-Developers:Tsunami", version.ref = "tsunami" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
brigadier = { module = "com.mojang:brigadier", version.ref = "brigadier" }
jperms = { module = "com.johnymuffin.jperms:beta", version.ref = "jperms" }
essentials-libs = { module = "com.earth2me.essentials:essentials-libraries-rollup", version.ref = "essentials-libs" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }